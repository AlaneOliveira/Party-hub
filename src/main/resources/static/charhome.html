<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Home - PartyHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/index.css"/>
</head>
<body class="bg-dark text-white"> 
    <nav class="navbar navbar-dark bg-secondary shadow mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-white d-flex align-items-center" href="gamerhome.html">
                <i class="bi bi-arrow-left me-2"></i> 
                <span class="d-none d-md-inline">Sair do Universo</span>
            </a>
            
            <div class="text-center">
                <span class="text-warning small d-block" style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;">Universo</span>
                <span id="universeDisplay" class="fw-bold text-white">Carregando...</span>
            </div>

            <a id="navProfileLink" href="#" class="d-flex align-items-center text-decoration-none">
                <img id="navProfileImg" src="images/default-avatar.jpg" 
                    class="rounded-circle border border-2 border-primary" 
                    style="width: 40px; height: 40px; object-fit: cover;">
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="card bg-secondary text-white p-3 mb-4 shadow border-0">
                    <h5 class="mb-3">Nova Postagem</h5>
                    <div class="mb-2">
                        <input type="text" id="postTitle" class="form-control mb-2" placeholder="Título do post">
                        <textarea id="postContent" class="form-control" rows="3" placeholder="O que você tem em mente?"></textarea>
                    </div>
                    <button onclick="enviarPost()" class="btn btn-primary w-100">Postar</button>
                </div>

                <div id="searchSection" class="card bg-secondary text-white p-3 shadow border-0">
                    <h5 class="mb-3">Buscar Jogadores</h5>
                    <div class="input-group mb-3 shadow-sm">
                        <span class="input-group-text bg-white border-0">
                            <i class="bi bi-search text-dark"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control border-0" placeholder="Nome do personagem...">
                        <button onclick="buscarJogadores()" class="btn btn-primary fw-bold px-3">Enviar</button>
                    </div>
                    <div id="suggestionsSection" class="card bg-secondary text-white p-3 mt-4 shadow border-0">
                        <h6 class="text-warning mb-3"><i class="bi bi-person-plus-fill"></i> Sugestões para você</h6>
                        <div id="suggestionsList">
                            </div>
                    </div>
                
                    <div id="playersList" class="mt-2 scrollable-list" style="max-height: 300px; overflow-y: auto;"></div>
                </div>
            </div>

            <div class="col-md-8">
                <h3 class="mb-4">Meu Feed</h3>
                <div id="feedContainer">
                    <div class="text-center p-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">Carregando posts...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>  

    <script src="js/auth.js"></script> 
    <script src="js/feed-logic.js"></script>
    <script src="js/charhome.js"></script> 
</body>
</html>
