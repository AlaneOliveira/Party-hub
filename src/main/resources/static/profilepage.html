<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Profile - PartyHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/index.css"/>
</head>
<body class="bg-dark text-white"> 
    <nav class="navbar navbar-dark bg-secondary shadow mb-4">
        <div class="container">
            <a class="navbar-brand text-white" href="charhome.html"><i class="bi bi-arrow-left"></i> Voltar</a>
            <span class="navbar-text fw-bold">Perfil do Personagem</span>
        </div>
    </nav>
    <div class="container">
        <div class="card bg-secondary border-0 shadow p-4 mb-4">
            <div class="row align-items-center text-center text-md-start">
                <div class="col-12 col-md-auto mb-3 mb-md-0">
                    <div class="position-relative d-inline-block">
                        <img id="profileImage" src="images/default-avatar.jpg" 
                            class="rounded-circle border border-4 border-primary" 
                            style="width: 150px; height: 150px; object-fit: cover;">
                        <button id="editPhotoBtn" class="btn btn-sm btn-light position-absolute bottom-0 end-0 rounded-circle d-none" onclick="document.getElementById('fileInput').click()">
                            <i class="bi bi-camera"></i>
                        </button>
                        <input type="file" id="fileInput" class="d-none" onchange="uploadPhoto(this.files[0])">
                    </div>
                </div>
                
                <div class="col-12 col-md">
                    <div class="ms-md-3">
                        <h2 id="profileName" class="mb-1">---</h2>
                        <p id="profileGame" class="text-warning mb-3">---</p>
                        
                        <div class="d-flex justify-content-center justify-content-md-start gap-3">
                            <button id="followBtn" onclick="toggleFollow()" class="btn btn-primary px-4 d-none">Seguir</button>
                            
                            <button id="manageBtn" class="btn btn-outline-light px-4 d-none" data-bs-toggle="modal" data-bs-target="#followingModal">
                                <i class="bi bi-people"></i> Seguindo
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <h4 class="text-start mb-3" id="postsTitle">Postagens</h4>
        <div id="characterPosts" class="row"></div>
    </div>

    <div class="modal fade" id="followingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-secondary text-white">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Pessoas que você segue</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-target="#followingModal" data-bs-toggle="modal"></button>
                </div>
                <div class="modal-body" id="followingList">
                    </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script> 
    <script src="js/profilepage.js"></script> 
</body>
</html>
